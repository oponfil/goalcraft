<!doctype html>
<html lang="en" translate="no">
<head>
  <meta charset="utf-8">
  <!-- The site translates itself (src/i18n.js): no browser translation on top of it. -->
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../favicon.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <title>Sign in — Goalcraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tiny5&family=Rubik:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../site.css?v=3a120dbf">
</head>
<body>
  <div class="wrap">
    <nav>
      <a class="logo" href="../"><img class="mark" src="../favicon.svg" alt="" width="24" height="24">Goalcraft</a>
      <div class="links">
        <a class="wide" href="../connect/" data-i18n="nav.connect">Connect</a>
        <a href="../pricing/" data-i18n="nav.pricing">Pricing</a>
      </div>
    </nav>

    <div class="card">
      <h1 data-i18n="login.h1">Sign in</h1>
      <p class="sub" data-i18n="login.sub">New here? The same steps create your account.</p>

      <div id="google" class="gbtn"></div>

      <div class="or" data-i18n="login.or">or with email</div>

      <form id="email-form">
        <input class="field" id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        <input class="field" id="password" type="password" autocomplete="current-password" data-i18n-attr="placeholder:login.password" placeholder="Password" hidden>
        <button class="btn" type="submit" data-i18n="login.send">Email me a sign-in link</button>
      </form>
      <!-- For accounts that have a password, such as the one app directory reviewers use: they
           cannot wait for an emailed link. -->
      <a class="alt-login" href="#" id="use-password" data-i18n="login.withPassword">Sign in with a password</a>

      <div class="msg" id="msg"></div>
    </div>

    <footer>
      <span data-i18n="footer.built">© 2026 Goalcraft</span>
      <span><a href="https://github.com/oponfil/goalcraft/blob/main/docs/MCP.md" target="_blank" rel="noopener" data-i18n="footer.docs">Docs</a> · <a href="../deck/" target="_blank" rel="noopener" data-i18n="footer.deck">Pitch deck</a> · <a href="../privacy/" data-i18n="footer.privacy">Privacy</a> · <a href="../terms/" data-i18n="footer.terms">Terms</a> · <a href="../contact/" data-i18n="footer.contact">Contact</a> · <a class="gh" href="https://github.com/oponfil/goalcraft" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a></span>
    </footer>
  </div>

  <script type="module">
    import { supabase, afterSignIn } from '../src/auth.js?v=3a120dbf';
    import { GOOGLE_CLIENT_ID } from '../src/config.js?v=3a120dbf';
    import { t, lang } from '../src/i18n.js?v=3a120dbf';

    const msg = document.getElementById('msg');
    const say = (text, kind = '') => { msg.textContent = text; msg.className = 'msg ' + kind; };
    // Back from a sign-in link that didn't work: it is one-time and short-lived.
    const failed = new URLSearchParams(location.hash.slice(1));
    if (failed.get('error')) {
      say(t(failed.get('error_code') === 'otp_expired' ? 'login.expired' : 'login.failed'), 'error');
      history.replaceState(null, '', location.pathname + location.search);
    }

    // Already signed in: go straight to the account page.
    const { data: { session } } = await supabase.auth.getSession();
    if (session) location.replace(afterSignIn());

    // Google's own button: the account picker names our site, not the Supabase host.
    // Google gets the hashed nonce, Supabase checks the token against the raw one.
    const nonce = crypto.randomUUID();
    const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(nonce));
    const hashedNonce = [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');

    const gis = document.createElement('script');
    gis.src = `https://accounts.google.com/gsi/client?hl=${lang === 'pt' ? 'pt-BR' : lang}`;
    gis.onload = () => {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        nonce: hashedNonce,
        callback: async ({ credential }) => {
          say(t('login.signing'));
          const { error } = await supabase.auth.signInWithIdToken({ provider: 'google', token: credential, nonce });
          if (error) say(error.message, 'error');
          else location.replace(afterSignIn());
        },
      });
      // Google draws its button at a fixed width, so it is drawn again when the panel's width changes
      // (a narrowed window would otherwise leave it sticking out of the panel).
      const box = document.getElementById('google');
      let drawnAt = 0, timer;
      const draw = () => {
        const width = Math.min(400, box.clientWidth);
        if (width === drawnAt) return;
        // Each drawing goes into a new holder: Google draws late, and a late one lands in the old,
        // detached holder instead of next to the new button.
        drawnAt = width;
        const holder = document.createElement('div');
        box.replaceChildren(holder);
        google.accounts.id.renderButton(holder, {
          theme: 'filled_black', size: 'large', shape: 'rectangular', text: 'continue_with', locale: lang === 'zh' ? 'zh_CN' : lang === 'pt' ? 'pt_BR' : lang,
          width,
        });
      };
      draw();
      new ResizeObserver(() => { clearTimeout(timer); timer = setTimeout(draw, 200); }).observe(box);
    };
    document.head.append(gis);

    // After a link is sent the button rests for a minute, counting down: Supabase refuses a second
    // link to the same address sooner anyway, and the first one is usually on its way.
    const COOLDOWN = 60;
    function cooldown(button) {
      let left = COOLDOWN;
      const tick = () => {
        if (left <= 0) { button.disabled = false; button.textContent = t('login.send'); return; }
        button.textContent = t('login.again', left--);
        setTimeout(tick, 1000);
      };
      tick();
    }

    // Two ways with an email: a sign-in link (the default) or a password; the link under the form
    // switches between them.
    const password = document.getElementById('password'), toggle = document.getElementById('use-password');
    toggle.addEventListener('click', e => {
      e.preventDefault();
      const toPassword = password.hidden;
      password.hidden = !toPassword; password.required = toPassword; password.value = '';
      if (toPassword) password.focus();
      toggle.textContent = t(toPassword ? 'login.withLink' : 'login.withPassword');
      const button = document.querySelector('#email-form button');
      if (!button.disabled) button.textContent = t(toPassword ? 'login.signIn' : 'login.send');
      say('');
    });

    document.getElementById('email-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim(), button = e.target.querySelector('button');
      if (!password.hidden) {
        if (button.disabled) return;
        button.disabled = true;
        say(t('login.signing'));
        const { error } = await supabase.auth.signInWithPassword({ email, password: password.value });
        button.disabled = false;
        if (error) return say(t('login.wrongPassword'), 'error');
        return location.replace(afterSignIn());
      }
      // One request at a time: a second click while the first is sending races it to create the
      // same new user, and the loser fails with a database error.
      if (button.disabled) return;
      // The browser lets through "name@gmail" and Supabase "name@gmail.c": ask for a domain with a
      // dot and a top-level part of two or more characters.
      if (!/^[^\s@]+@[^\s@]+\.[a-z][a-z0-9-]*[a-z0-9]$/i.test(email)) return say(t('login.badEmail'), 'error');
      button.disabled = true;
      say(t('login.sending'));
      // lang: a new account starts in the language of this page, and its sign-up email comes in it.
      const { error } = await supabase.auth.signInWithOtp({ email, options: { emailRedirectTo: afterSignIn(), data: { lang } } });
      if (!error) { say(t('login.check', email), 'ok'); return cooldown(button); }
      button.disabled = false;
      if (error.code === 'email_address_invalid' || error.code === 'validation_failed') say(t('login.badEmail'), 'error');
      else if (error.status === 429 || /rate_limit/.test(error.code || '')) say(t('login.tooMany'), 'error');
      else say(t('login.sendFailed'), 'error');
    });
  </script>
  <script type="module" src="../src/nav.js?v=3a120dbf"></script>
</body>
</html>
